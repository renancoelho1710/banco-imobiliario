<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C2A4A"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#090E1A"/>
    </linearGradient>
    <linearGradient id="brand" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="off"/>
      <feComponentTransfer in="off" result="shadow">
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="44" y="44" width="424" height="424" rx="96" fill="url(#bg)"/>
  <rect x="44" y="44" width="424" height="424" rx="96" fill="none" stroke="#1F2A44" stroke-width="6" opacity="0.9"/>

  <!-- Inner glass -->
  <g filter="url(#soft)">
    <rect x="92" y="92" width="328" height="328" rx="72" fill="#0F1A30" opacity="0.75"/>
    <path d="M120 140C180 105 255 105 330 135C372 152 405 155 420 150V190C400 198 368 195 326 180C250 152 180 155 120 190Z"
          fill="#ffffff" opacity="0.07"/>
  </g>

  <!-- Bank / Monopoly vibe icon -->
  <g filter="url(#soft)">
    <!-- Roof -->
    <path d="M136 214L256 144L376 214" fill="none" stroke="url(#brand)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Columns -->
    <path d="M178 235V336" stroke="#E8EEF9" stroke-width="18" stroke-linecap="round" opacity="0.92"/>
    <path d="M256 235V336" stroke="#E8EEF9" stroke-width="18" stroke-linecap="round" opacity="0.92"/>
    <path d="M334 235V336" stroke="#E8EEF9" stroke-width="18" stroke-linecap="round" opacity="0.92"/>

    <!-- Base -->
    <path d="M150 356H362" stroke="url(#brand)" stroke-width="20" stroke-linecap="round"/>

    <!-- Coin -->
    <circle cx="356" cy="308" r="46" fill="#0B1220" stroke="url(#brand)" stroke-width="12"/>
    <path d="M356 282V334" stroke="#E8EEF9" stroke-width="12" stroke-linecap="round"/>
    <path d="M336 296H376" stroke="#E8EEF9" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Subtle highlight border -->
  <path d="M90 168C118 118 166 92 216 92H308C372 92 420 140 420 204V296C420 346 394 394 344 422"
        fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.08" stroke-linecap="round"/>
</svg>
