    <path d="M324 246V350" stroke="#E8EEF9" stroke-width="18" stroke-linecap="round" opacity="0.92"/>
    <!-- Base -->
    <path d="M160 370H352" stroke="url(#brand)" stroke-width="20" stroke-linecap="round"/>

    <!-- Coin -->
    <circle cx="346" cy="322" r="44" fill="#0B1220" stroke="url(#brand)" stroke-width="12"/>
    <path d="M346 298V346" stroke="#E8EEF9" stroke-width="12" stroke-linecap="round"/>
    <path d="M328 312H364" stroke="#E8EEF9" stroke-width="12" stroke-linecap="round"/>
